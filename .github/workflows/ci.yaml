name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'k8s/**'  # STOP THE LOOP: Don't run if only the k8s YAML changes

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/my-app:${{ github.sha }}

    - name: Update Kubernetes Manifest
      run: |
        # Configure Git
        git config --global user.email "github-actions@github.com"
        git config --global user.name "GitHub Actions"
        
        # Update the image tag in the YAML file
        # This replaces 'my-app:anything' with 'my-app:current-commit-hash'
        sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/my-app:${{ github.sha }}|g" k8s/web-deployment.yaml
        
        # Commit and Push the change
        git add k8s/web-deployment.yaml
        git commit -m "Update image to ${{ github.sha }}"
        git push
